version: "3.9"

services:
  mongo:
    image: mongo:7.0
    container_name: betting-mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: >
        mongosh --port 27017 --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  transaction-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transaction-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/betting_sim?replicaSet=rs0
    depends_on:
      mongo:
        condition: service_healthy
    restart: on-failure

volumes:
  mongo_data:
